<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting to Discord...</title>
    <!-- 1. The Instant Meta Redirect -->
    <meta http-equiv="refresh" content="0; url=https://discord.gg">
    <link rel="canonical" href="https://discord.gg">
</head>
<body>
    <!-- 2. Fallback link in case their browser has redirects disabled -->
    <p>If you are not redirected automatically, follow this <a href="https://discord.gg">link to our Discord server</a>.</p>
    
    <!-- 3. JavaScript Fallback Backup -->
    <script>
        window.location.href = "https://discord.gg";
    </script>
</body>
</html>
